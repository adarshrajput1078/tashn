<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hack Pay - Unlock Panel</title>
    <style>
        /* CSS Styling - Hacker / Cyberpunk Theme */
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #050505;
            color: #00ff00;
            font-family: 'Share Tech Mono', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            background: #111;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 0 20px #00ff0033, inset 0 0 20px #00ff0011;
            border: 1px solid #00ff0055;
            max-width: 450px;
            width: 90%;
            position: relative;
        }

        /* Glitch Effect for Heading */
        h1 {
            font-size: 28px;
            margin-bottom: 15px;
            color: #fff;
            text-shadow: 0 0 10px #00ff00, 0 0 20px #00ff00;
            letter-spacing: 2px;
        }

        p.subtitle {
            font-size: 16px;
            color: #b3b3b3;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .highlight {
            color: #ff003c;
            font-weight: bold;
            text-shadow: 0 0 8px #ff003c;
        }

        /* QR Code Container */
        .qr-wrapper {
            background: #fff;
            padding: 15px;
            border-radius: 10px;
            display: inline-block;
            margin-bottom: 20px;
            box-shadow: 0 0 15px #00ff0088;
            transition: transform 0.3s ease;
        }

        .qr-wrapper:hover {
            transform: scale(1.05);
        }

        .qr-wrapper img {
            width: 200px;
            height: 200px;
            display: block;
        }

        .upi-id {
            font-size: 18px;
            background: #002200;
            padding: 10px;
            border-radius: 5px;
            border: 1px dashed #00ff00;
            margin-bottom: 25px;
            word-break: break-all;
        }

        /* Animated Button */
        button {
            background: transparent;
            color: #00ff00;
            font-family: 'Share Tech Mono', monospace;
            font-size: 18px;
            padding: 12px 30px;
            border: 2px solid #00ff00;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 10px #00ff0055 inset;
        }

        button:hover {
            background: #00ff00;
            color: #000;
            box-shadow: 0 0 20px #00ff00;
        }

        /* Status text hidden by default */
        #status-msg {
            margin-top: 20px;
            font-size: 14px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>SYSTEM LOCKED</h1>
        <p class="subtitle">Active Your Hack Pay.<br> Send Minimum <span class="highlight">₹100</span> to Unlock your number panel.</p>
        
        <div class="qr-wrapper">
            <!-- Dynamic QR Code pointing to the UPI ID -->
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=upi://pay?pa=adarshrajput1078@fam%26pn=Hack%20Panel%26cu=INR" alt="UPI QR Code">
        </div>

        <div class="upi-id">
            UPI ID: <strong>adarshrajput1078@fam</strong>
        </div>

        <button onclick="verifyPayment()">Verify Payment</button>

        <p id="status-msg">Scanning network for transaction... Please wait.</p>
    </div>

    <script>
        // JavaScript for Interactive Elements
        function verifyPayment() {
            const btn = document.querySelector('button');
            const statusMsg = document.getElementById('status-msg');
            
            // Button visual change
            btn.innerText = "Verifying...";
            btn.style.pointerEvents = "none";
            btn.style.opacity = "0.7";
            
            // Show status message
            statusMsg.style.display = "block";
            statusMsg.style.color = "#ffff00"; // Yellow scanning text

            // Simulate a network delay (fake verification process)
            setTimeout(() => {
                statusMsg.style.color = "#ff003c"; // Red warning text
                statusMsg.innerText = "Error: Payment not detected! Complete ₹100 payment first.";
                
                // Reset button
                btn.innerText = "Verify Payment";
                btn.style.pointerEvents = "auto";
                btn.style.opacity = "1";
            }, 3500); // 3.5 seconds delay
        }
    </script>

</body>
</html>
