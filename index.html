<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VK BHURIYA • NEON VIP HACK</title>
    
    <!-- Premium Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Rajdhani:wght@600;700;900&family=Fira+Code:wght@600;800&display=swap" rel="stylesheet">
    
    <style>
        /* ==========================================================================
           🌟 ROOT VARIABLES - MASTER COLOR & SIZING CONFIGURATION (NEON THEME)
           ========================================================================== */
        :root { 
            --bg-master: #040404; 
            --bg-card: #0a0a0c;
            --bg-inner: #0f0f13;
            
            --neon-white: #ffffff;
            --glow-white: rgba(255, 255, 255, 0.5);
            
            --neon-pink: #ff4d79; 
            --glow-pink: rgba(255, 77, 121, 0.4);
            --neon-green: #00ff88; 
            --glow-green: rgba(0, 255, 136, 0.4);
            
            --text-muted: #888888;
            --gold: #ffd700;
            --red-loss: #ff3333;
            
            --font-main: 'Rajdhani', sans-serif; 
            --font-ui: 'Inter', sans-serif;
            --font-mono: 'Fira Code', monospace;
            
            /* Reduced Heights for Sleek Look */
            --header-height: 70px;  
            --nav-height: 70px;     
        }

        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        body, html { width: 100%; height: 100vh; height: 100dvh; background-color: var(--bg-master); color: #fff; font-family: var(--font-ui); overflow: hidden; display: flex; flex-direction: column; }

        /* ==========================================================================
           🌟 TOP HEADER (COMPACT)
           ========================================================================== */
        .app-header {
            flex: 0 0 var(--header-height); background: var(--bg-master);
            border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; 
            align-items: center; justify-content: flex-start; padding: 0 15px;
            z-index: 50; position: relative;
        }
        
        .dev-badge {
            position: absolute; top: 10px; right: 15px;
            font-family: var(--font-mono); font-size: 9px; font-weight: 800; color: #444; letter-spacing: 1.5px;
        }

        .header-left { display: flex; align-items: center; gap: 12px; }
        
        .brand-logo { 
            width: 42px; height: 42px; border-radius: 50%; object-fit: cover; 
            border: 1px solid rgba(255,255,255,0.8); box-shadow: 0 0 12px rgba(255,255,255,0.4);
            animation: pulseLogo 3s infinite alternate;
        }
        
        @keyframes pulseLogo { 0% { box-shadow: 0 0 8px rgba(255,255,255,0.2); } 100% { box-shadow: 0 0 18px rgba(255,255,255,0.6); } }

        .brand-text { display: flex; flex-direction: column; justify-content: center; }
        .vk-title { font-family: var(--font-main); font-size: 1.6rem; font-weight: 900; letter-spacing: 1px; color: var(--neon-white); line-height: 1; text-shadow: 0 0 12px var(--glow-white); }
        .tashan-subtitle { font-family: var(--font-ui); font-size: 0.65rem; font-weight: 600; color: #777; letter-spacing: 2px; text-transform: uppercase; margin-top: 2px; }

        /* ==========================================================================
           🌟 MIDDLE CONTENT AREA 
           ========================================================================== */
        .app-content { flex: 1; position: relative; width: 100%; overflow: hidden; }

        /* 🎮 GAME IFRAME VIEW */
        #gameView { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; opacity: 0; pointer-events: none; transition: opacity 0.4s ease; background: #000; }
        #gameView.active { opacity: 1; pointer-events: auto; }
        iframe { width: 100%; height: 100%; border: none; }

        /* ⚡ HACK VIEW CONTAINER */
        #hackView {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 20; 
            background: var(--bg-master); opacity: 0; pointer-events: none; transition: opacity 0.4s ease;
            display: flex; flex-direction: column; align-items: center; overflow-y: auto; padding: 15px;
        }
        #hackView.active { opacity: 1; pointer-events: auto; }

        /* ==========================================================================
           🌟 AUTHENTICATION OVERLAY 
           ========================================================================== */
        #authOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(4, 4, 4, 0.95); z-index: 900;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            backdrop-filter: blur(15px); transition: 0.5s ease;
        }

        .auth-card {
            background: var(--bg-card); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px; padding: 30px 25px; width: 90%; max-width: 360px;
            text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.9), inset 0 0 30px rgba(255,255,255,0.02);
            animation: slideUp 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .auth-card h2 { font-family: var(--font-main); color: var(--neon-white); font-size: 2rem; text-shadow: 0 0 15px rgba(255,255,255,0.4); margin-bottom: 5px; }

        .input-uid { 
            width: 100%; padding: 15px; margin: 20px 0; background: #000; border: 1px solid rgba(255,255,255,0.2); 
            border-radius: 12px; color: var(--neon-white); font-size: 1.2rem; text-align: center; 
            font-family: var(--font-mono); font-weight: 800; outline: none; transition: 0.3s; 
        }
        .input-uid:focus { border-color: var(--neon-white); box-shadow: 0 0 15px var(--glow-white); }
        
        .btn-connect { 
            width: 100%; padding: 14px; background: var(--neon-white); color: #000; 
            border: none; border-radius: 12px; font-family: var(--font-main); font-size: 1.2rem; 
            font-weight: 900; letter-spacing: 2px; cursor: pointer; 
            box-shadow: 0 0 20px var(--glow-white), 0 5px 15px rgba(255,255,255,0.3); transition: 0.2s; 
        }
        .btn-connect:active { transform: scale(0.95); box-shadow: 0 0 10px var(--glow-white); }
        
        .status-msg { margin-top: 20px; font-size: 0.85rem; color: #fff; background: rgba(255,255,255,0.05); border: 1px dashed rgba(255,255,255,0.3); padding: 12px; border-radius: 10px; display: none; }

        /* ==========================================================================
           🌟 MAIN PREDICTOR UI 
           ========================================================================== */
        .predictor-container { width: 100%; max-width: 450px; display: flex; flex-direction: column; gap: 15px; animation: fadeIn 0.8s ease; }

        .live-strip { 
            display: flex; justify-content: space-between; align-items: center; 
            background: var(--bg-card); padding: 12px 18px; border-radius: 14px; 
            border: 1px solid rgba(255,255,255,0.1); font-family: var(--font-mono); font-weight: 800; 
        }
        .period-text { color: #fff; font-size: 1rem; letter-spacing: 1px; }
        .period-id { color: #fff; }
        
        .timer-wrapper { display: flex; align-items: center; gap: 8px; font-size: 1rem; }
        .spinner-ring { width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.2); border-top: 2px solid #fff; border-radius: 50%; animation: spin 1s linear infinite; }

        /* Big Prediction Box */
        .ai-card { 
            background: var(--bg-inner); border-radius: 18px; padding: 35px 20px; 
            text-align: center; transition: 0.4s ease; position: relative; 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .ai-card.big { border: 2px solid var(--neon-pink); box-shadow: inset 0 0 30px var(--glow-pink), 0 0 20px rgba(255,77,121,0.1); }
        .ai-card.small { border: 2px solid var(--neon-green); box-shadow: inset 0 0 30px var(--glow-green), 0 0 20px rgba(0,255,136,0.1); }
        .ai-card.glitch { border: 2px dashed #555; box-shadow: none; animation: shake 0.2s infinite; }
        
        @keyframes shake { 0% { transform: translate(1px, 1px) rotate(0deg); } 50% { transform: translate(-1px, -1px) rotate(0deg); } 100% { transform: translate(1px, -1px) rotate(0deg); } }

        .pred-size { font-family: var(--font-main); font-size: 4.5rem; font-weight: 900; letter-spacing: 4px; line-height: 1; margin-bottom: 20px; text-shadow: 0 0 20px currentColor; }
        .ai-card.big .pred-size { color: var(--neon-pink); }
        .ai-card.small .pred-size { color: var(--neon-green); }
        .ai-card.glitch .pred-size { color: #fff; text-shadow: 0 0 10px #fff; font-size: 3rem; }

        .sure-title { font-size: 10px; color: #aaa; letter-spacing: 2px; font-weight: 700; text-transform: uppercase; margin-bottom: 12px; border-bottom: 1px dashed rgba(255,255,255,0.2); padding-bottom: 5px; width: 80%; }
        
        .img-container { display: flex; justify-content: center; align-items: center; gap: 15px; min-height: 50px; }
        .img-container img { width: 45px; height: 45px; object-fit: contain; filter: drop-shadow(0 0 8px rgba(255,255,255,0.4)); animation: popScale 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

        /* ==========================================================================
           📜 HISTORY TABLE (IMAGES ADDED IN DRAW)
           ========================================================================== */
        .history-card { width: 100%; background: var(--bg-card); border-radius: 14px; border: 1px solid rgba(255,255,255,0.05); overflow: hidden; margin-bottom: 30px; }
        .history-title { background: #000; padding: 12px; text-align: center; font-family: var(--font-main); color: var(--neon-white); font-size: 1.1rem; font-weight: 800; letter-spacing: 2px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        table { width: 100%; border-collapse: collapse; text-align: center; font-size: 0.75rem; }
        th { background: rgba(255,255,255,0.02); padding: 10px 5px; color: #888; font-weight: 700; font-family: var(--font-ui); letter-spacing: 1px; }
        td { padding: 10px 5px; border-bottom: 1px solid rgba(255,255,255,0.03); font-family: var(--font-mono); font-weight: 800; color: #ddd; vertical-align: middle; }
        
        .td-pred { font-size: 0.65rem; color: #aaa; }
        .td-pred strong { color: #fff; font-size: 0.85rem; }
        .td-draw img { width: 28px; height: 28px; object-fit: contain; filter: drop-shadow(0 0 5px rgba(255,215,0,0.5)); vertical-align: middle; }
        
        .win { color: var(--neon-green); text-shadow: 0 0 10px var(--glow-green); }
        .loss { color: var(--red-loss); font-weight: 800; }
        .jackpot { color: var(--gold); font-weight: 900; text-shadow: 0 0 10px rgba(255,215,0,0.5); }

        /* ==========================================================================
           📱 BOTTOM NAVIGATION (SMALLER & COMPACT)
           ========================================================================== */
        .app-nav {
            flex: 0 0 var(--nav-height); background: transparent; padding: 0 20px; margin-bottom: 15px;
            display: flex; gap: 15px; justify-content: center; align-items: center; z-index: 50;
        }
        
        .pill-btn {
            flex: 1; padding: 14px 0; border-radius: 50px; 
            font-family: var(--font-main); font-size: 1.1rem; font-weight: 900; 
            letter-spacing: 1.5px; cursor: pointer; transition: 0.3s;
            display: flex; justify-content: center; align-items: center; gap: 6px;
        }
        
        .btn-hack { background: #000; color: var(--neon-white); border: 2px solid var(--neon-white); box-shadow: 0 0 12px var(--glow-white), inset 0 0 8px rgba(255,255,255,0.2); text-shadow: 0 0 5px var(--neon-white); }
        .btn-game { background: #111; color: #555; border: 2px solid #333; box-shadow: none; }
        .pill-btn:active { transform: scale(0.95); }

        @keyframes slideUp { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes popIn { 0% { transform: translate(-50%, -40%) scale(0.9); opacity: 0; } 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
        @keyframes popScale { 0% { transform: scale(0.5); opacity: 0; } 80% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(1); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        #toast { position: fixed; top: 80px; left: 50%; transform: translate(-50%, -50px); background: var(--neon-white); color: #000; padding: 12px 25px; border-radius: 10px; font-weight: 900; font-family: var(--font-ui); z-index: 9999; opacity: 0; pointer-events: none; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); box-shadow: 0 10px 30px rgba(255,255,255,0.4); white-space: nowrap; }
        #toast.show { transform: translate(-50%, 0); opacity: 1; pointer-events: auto; }
    </style>
</head>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, get, set, update, onValue } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA460iWlzdbX8G2iFGGThXReVF5xzW1ZWQ",
            authDomain: "rr-rental.firebaseapp.com",
            databaseURL: "https://rr-rental-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "rr-rental",
            storageBucket: "rr-rental.firebasestorage.app",
            messagingSenderId: "69307478861",
            appId: "1:69307478861:web:f237ad774f2bf4c20ffd04"
        };
        const app = initializeApp(firebaseConfig); 
        const db = getDatabase(app);

        window.App = class {
            static switchTab(tab) {
                const btnHack = document.getElementById('btnHackTab');
                const btnGame = document.getElementById('btnGameTab');
                const viewHack = document.getElementById('hackView');
                const viewGame = document.getElementById('gameView');

                btnHack.className = 'pill-btn btn-game';
                btnGame.className = 'pill-btn btn-game';
                viewHack.classList.remove('active');
                viewGame.classList.remove('active');

                if (tab === 'hack') {
                    btnHack.className = 'pill-btn btn-hack';
                    viewHack.classList.add('active');
                } else if (tab === 'game') {
                    btnGame.className = 'pill-btn btn-hack'; 
                    viewGame.classList.add('active');
                }
            }

            static toast(msg, isError = true) {
                const t = document.getElementById('toast');
                t.innerText = msg;
                t.style.background = isError ? "var(--red-loss)" : "var(--neon-white)";
                t.style.color = isError ? "#fff" : "#000";
                t.classList.add('show');
                setTimeout(() => t.classList.remove('show'), 3000);
            }
        }

        onValue(ref(db, 'settings/game_link'), (snap) => {
            if(snap.exists() && snap.val() !== "") document.getElementById('gameIframe').src = snap.val();
        });

        window.Auth = class {
            static async verify() {
                let uid = document.getElementById('uidInput').value.trim();
                let btn = document.getElementById('authBtn');
                
                if(!uid) return App.toast("PLEASE ENTER A VALID UID!");
                
                btn.innerHTML = '<span class="spinner-ring" style="border-top-color:#000;"></span>'; 
                btn.disabled = true;

                try {
                    let snap = await get(ref(db, 'approved_uids/' + uid));
                    if(snap.exists()) {
                        let data = snap.val();
                        if(data.is_banned) {
                            btn.innerText = "UNLOCK SYSTEM"; btn.disabled = false;
                            return App.toast("ACCESS DENIED: UID HAS BEEN BANNED.");
                        }
                        
                        document.getElementById('authOverlay').style.display = 'none';
                        document.getElementById('predictorUi').style.display = 'flex';
                        App.toast("HACK SUCCESSFULLY UNLOCKED!", false);
                        
                        HackEngine.init();

                    } else {
                        await set(ref(db, 'uid_requests/' + uid), { timestamp: Date.now(), status: "pending" });
                        btn.style.display = 'none';
                        document.getElementById('statusMsg').style.display = 'block';
                        App.toast("REQUEST FORWARDED TO ADMIN");
                    }
                } catch(e) {
                    btn.innerText = "UNLOCK SYSTEM"; btn.disabled = false;
                    App.toast("CONNECTION FAILED. TRY AGAIN.");
                }
            }
        }

        window.HackEngine = class {
            static historyData = [];
            static lastProcessedPeriod = null;
            static currentPrediction = null;

            static init() {
                this.syncApiData();
                setInterval(() => this.updateClock(), 1000);
            }

            static async syncApiData() {
                try {
                    const response = await fetch("https://draw.ar-lottery01.com/WinGo/WinGo_1M/GetHistoryIssuePage.json");
                    const json = await response.json();
                    
                    if(json && json.data && json.data.list) {
                        const draws = json.data.list.map(item => {
                            const n = parseInt(item.number, 10);
                            return { issue: String(item.issueNumber), number: n, size: n >= 5 ? "BIG" : "SMALL" };
                        }).filter(d => !isNaN(d.number));

                        this.historyData = draws.slice(0, 25);
                        let mostRecentDraw = this.historyData[0];

                        if (this.lastProcessedPeriod !== null && this.lastProcessedPeriod !== mostRecentDraw.issue && this.currentPrediction) {
                            this.addResultToTable(this.currentPrediction, mostRecentDraw.number, mostRecentDraw.issue.slice(-6), mostRecentDraw.size);
                        }

                        let nextPeriodId = (BigInt(mostRecentDraw.issue) + 1n).toString();
                        let aiResult = this.calculatePrediction(this.historyData);
                        
                        this.currentPrediction = { issue: nextPeriodId, size: aiResult.size, sureNums: aiResult.nums };
                        
                        this.renderPrediction(this.currentPrediction);
                        
                        if (this.lastProcessedPeriod === null && this.historyData.length > 1) {
                            this.seedHistoricalTable();
                        }
                        
                        this.lastProcessedPeriod = mostRecentDraw.issue;
                    }
                } catch (error) { console.log("API Sync delayed."); }
            }

            static calculatePrediction(history) {
                let pSize = "BIG";
                let recent = history.slice(0, 12);
                let sizes = recent.map(r => r.size);
                
                if (sizes.length >= 3 && sizes[0] === sizes[1] && sizes[1] === sizes[2]) {
                    pSize = sizes[0] === "BIG" ? "SMALL" : "BIG"; 
                } else {
                    let last7 = sizes.slice(0, 7);
                    let bigCount = last7.filter(s => s === "BIG").length;
                    pSize = bigCount > 3 ? "SMALL" : "BIG"; 
                }

                let pool = pSize === "BIG" ? [5,6,7,8,9] : [0,1,2,3,4];
                let num1 = pool[Math.floor(Math.random() * 2)];
                let num2 = pool[Math.floor(Math.random() * 2) + 2];
                if(num1 === num2) num2 = pool[4];

                return { size: pSize, nums: [num1, num2] };
            }

            // 🔥 SERVER DECODING ANIMATION (HACKER VIBE) 🔥
            static renderPrediction(pred) {
                document.getElementById('displayPeriod').innerText = pred.issue.slice(-6);
                
                const card = document.getElementById('aiCard');
                const textEl = document.getElementById('predText');
                const imgBox = document.getElementById('imgBox');
                
                // Add Glitch Effect
                card.className = 'ai-card glitch';
                let ticks = 0;
                
                let decodeAnim = setInterval(() => {
                    textEl.innerText = Math.random() > 0.5 ? "B!G" : "SM@LL";
                    imgBox.innerHTML = '<span style="color:#888; font-size:11px; font-weight:800;">DECODING SERVER...</span>';
                    ticks++;
                    
                    if(ticks > 8) {
                        clearInterval(decodeAnim);
                        // Final Reveal
                        textEl.innerText = pred.size;
                        card.className = `ai-card ${pred.size.toLowerCase()}`;
                        
                        imgBox.innerHTML = `
                            <img src="${pred.sureNums[0]}.png" onerror="this.style.display='none'">
                            <img src="${pred.sureNums[1]}.png" onerror="this.style.display='none'">
                        `;
                    }
                }, 120); // Fast switching
            }

            static seedHistoricalTable() {
                const tbody = document.getElementById('historyTbody');
                tbody.innerHTML = '';
                const chronological = [...this.historyData].reverse();
                
                for (let i = 1; i < chronological.length; i++) {
                    const draw = chronological[i];
                    const priorDraws = chronological.slice(0, i).reverse();
                    const aiCalc = this.calculatePrediction(priorDraws);
                    this.addResultToTable({ size: aiCalc.size, sureNums: aiCalc.nums }, draw.number, draw.issue.slice(-6), draw.size, true);
                }
            }

            // 🔥 HISTORY RESULTS SHOWN AS IMAGES 🔥
            static addResultToTable(predObj, drawnNum, shortIssue, drawnSize, isInitialSeed = false) {
                const tbody = document.getElementById('historyTbody');
                
                let isJackpot = predObj.sureNums.includes(drawnNum);
                let isWin = (drawnSize === predObj.size);
                
                let cssClass = isJackpot ? "jackpot" : (isWin ? "win" : "loss");
                let textResult = isJackpot ? "⭐ JACKPOT" : (isWin ? "✅ WIN" : "❌ LOSS");
                
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${shortIssue}</td>
                    <td class="td-pred"><strong>${predObj.size}</strong><br>(${predObj.sureNums[0]}, ${predObj.sureNums[1]})</td>
                    <td class="td-draw">
                        <img src="${drawnNum}.png" style="width: 25px; height: 25px; object-fit: contain; filter: drop-shadow(0 0 5px rgba(255,215,0,0.4));" onerror="this.outerHTML='${drawnNum}'">
                    </td>
                    <td class="${cssClass}">${textResult}</td>
                `;
                
                if(tbody.firstElementChild && tbody.firstElementChild.innerText.includes("Waiting")) tbody.innerHTML = '';

                if (isInitialSeed) { 
                    tbody.prepend(tr); 
                } else {
                    tbody.insertBefore(tr, tbody.firstChild);
                    if (tbody.children.length > 15) tbody.removeChild(tbody.lastChild);
                }
            }

            static updateClock() {
                const f = new Intl.DateTimeFormat('en-US', { timeZone: 'Asia/Kolkata', hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
                const p = f.formatToParts(new Date());
                const t = {}; p.forEach(x => t[x.type] = x.value);
                
                let sec = parseInt(t.second);
                let remSec = 60 - sec; if(remSec === 60) remSec = 0;
                
                document.getElementById('displayTimer').innerText = `00:${String(remSec).padStart(2,'0')}`;
                if (remSec === 58 || remSec === 28) this.syncApiData();
            }
        }
    </script>
</body>
</html>
